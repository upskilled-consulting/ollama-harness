name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --group dev
          uv pip install -e .

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Lint (ruff)
        run: uv run ruff check harness/ scripts/ tests/

      - name: Type check (mypy)
        run: uv run mypy harness/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # advisory only — tighten gradually

      - name: Security scan (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .
          # PYSEC-2026-311: chromadb server-endpoint RCE (trust_remote_code).
          # Harness uses embedded PersistentClient/EphemeralClient only — never
          # runs the chromadb HTTP server — so the vulnerable path is unreachable.
          # No fixed release exists yet; revisit when one ships.
          ignore-vulns: PYSEC-2026-311

      - name: Test with coverage
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            -m "not requires_ollama" \
            --cov=harness \
            --cov-report=term-missing \
            --cov-fail-under=13
        env:
          DATA_DIR: /tmp/harness-ci-data

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build
