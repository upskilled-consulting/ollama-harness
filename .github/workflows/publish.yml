name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # trigger on v0.1.0, v1.2.3, etc.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing (no token needed)

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # need full history to check branch membership

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::This tag does not point to a commit on main — refusing to publish"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          uv sync --group dev
          uv pip install -e .
          uv run pytest tests/ \
            -q \
            -m "not requires_ollama" \
            --cov=harness \
            --cov-fail-under=20
        env:
          DATA_DIR: /tmp/harness-ci-data

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC — configure trusted publishing at pypi.org/manage/project/ollama-harness/
        # No PYPI_API_TOKEN secret needed
