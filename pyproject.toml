[project]
name = "ollama-harness"
version = "0.1.0"
description = "Self-improving agentic research swarm with local LLM inference"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nick McCarty", email = "nick@upskilled.consulting" }]
keywords = ["llm", "agent", "research", "ollama", "rlhf", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"

dependencies = [
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    # Data / config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Inference
    "ollama>=0.4",
    "httpx>=0.27",
    # Memory / retrieval
    "chromadb>=0.5",
    "sqlite-vec>=0.1",
    "numpy>=1.26",
    # Templates
    "jinja2>=3.1",
    "markupsafe>=2.1",
    # Document parsing
    "markitdown[all]>=0.0.1",
    "pillow>=10.0",
    "pytesseract>=0.3",
    # Research skills
    "duckduckgo-search>=6.0",
    "playwright>=1.44",
    "youtube-transcript-api>=0.6",
    # Semantic Scholar
    "requests>=2.32",
    # Deck generation
    "python-pptx>=1.0",
    # CLI
    "pyfiglet>=1.0",
    "rich>=13.0",
    "feedparser>=6.0.12",
]

[project.urls]
Homepage   = "https://github.com/upskilled-consulting/ollama-harness"
Repository = "https://github.com/upskilled-consulting/ollama-harness"
Issues     = "https://github.com/upskilled-consulting/ollama-harness/issues"

[project.optional-dependencies]
# CUDA torch — installed separately via uv sync --extra gpu
# CPU torch is pulled automatically as a transitive dep of sentence-transformers
gpu = [
    "torch>=2.3",
]
finetune = [
    "torch>=2.3",
    "transformers>=4.40",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.19",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests>=2.32",
    "honcho>=2.0",
]

[project.scripts]
oh       = "harness.cli:main"
harness  = "harness.api.main:serve"

[tool.setuptools.packages.find]
where   = ["."]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.skills" = ["*.j2", "templates/*.j2"]

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "honcho>=2.0",
    "types-requests>=2.32",
    "types-Markdown>=3.6",
]

[tool.uv]

# Route torch through the PyTorch CUDA 11.8 index so `uv sync --extra gpu`
# installs the CUDA wheel instead of the CPU wheel from PyPI.
# CPU-only installs (no --extra gpu) still work — sentence-transformers pulls
# the CPU wheel automatically.
[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name     = "pytorch-cu118"
url      = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.ruff]
target-version = "py312"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long
    "B008",   # function call in default arg
    "E702",   # multiple statements on one line (semicolon)
    "E701",   # multiple statements on one line (colon)
    "E741",   # ambiguous variable name (common in ML/data code)
    "B905",   # zip() without strict (minor)
    "B007",   # loop control variable unused
    "B904",   # raise without from
    "B023",   # closure binding of loop variable
    "F841",   # local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
"harness/api/*"                        = ["B"]
"harness/agent.py"                     = ["E402", "I001"]
"harness/mcp_server.py"                = ["E402", "I001"]
"harness/skills/lit_review_skill.py"   = ["E402"]
"scripts/_test_email.py"               = ["E402"]
"scripts/test_inference_shim.py"       = ["E402"]
"scripts/supervisor.py"                = ["I001"]

[tool.mypy]
python_version         = "3.12"
strict                 = false
ignore_missing_imports = true
implicit_optional      = true   # PEP 484 no_implicit_optional tightened in mypy 1.0; restore lenient behaviour while we type gradually

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers = [
    "requires_ollama: test needs a live Ollama server (skip in CI with -m 'not requires_ollama')",
    "requires_browser: test needs a real Chromium session",
    "slow: test takes more than 10 seconds",
]
