[project]
name = "ollama-harness"
version = "0.1.0"
description = "Self-improving agentic research swarm with local LLM inference"
requires-python = ">=3.12"

dependencies = [
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    # Data / config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Inference
    "ollama>=0.4",
    "httpx>=0.27",
    # Memory / retrieval
    "chromadb>=0.5",
    "sqlite-vec>=0.1",
    "numpy>=1.26",
    # Templates
    "jinja2>=3.1",
    "markupsafe>=2.1",
    # Document parsing
    "markitdown[all]>=0.0.1",
    "pillow>=10.0",
    "pytesseract>=0.3",
    # Research skills
    "duckduckgo-search>=6.0",
    "playwright>=1.44",
    "youtube-transcript-api>=0.6",
    # Semantic Scholar
    "requests>=2.32",
]

[project.optional-dependencies]
# CUDA torch — installed separately via uv sync --extra gpu
# CPU torch is pulled automatically as a transitive dep of sentence-transformers
gpu = [
    "torch>=2.3",
]
finetune = [
    "torch>=2.3",
    "transformers>=4.40",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.19",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests>=2.32",
    "honcho>=2.0",
]

[project.scripts]
oh       = "harness.cli:main"
harness  = "harness.api.main:serve"

[tool.setuptools.packages.find]
where   = ["."]
include = ["harness*"]

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "honcho>=2.0",
]

# Route torch through the PyTorch CUDA 11.8 index so `uv sync --extra gpu`
# installs the CUDA wheel instead of the CPU wheel from PyPI.
# CPU-only installs (no --extra gpu) still work — sentence-transformers pulls
# the CPU wheel automatically.
[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name     = "pytorch-cu118"
url      = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.ruff]
target-version = "py312"
line-length    = 100
select         = ["E", "F", "I", "UP", "B"]
ignore         = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"harness/api/*" = ["B"]

[tool.mypy]
python_version        = "3.12"
strict                = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers = [
    "requires_ollama: test needs a live Ollama server (skip in CI with -m 'not requires_ollama')",
    "requires_browser: test needs a real Chromium session",
    "slow: test takes more than 10 seconds",
]
