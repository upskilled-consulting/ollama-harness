[project]
name = "harness"
version = "0.1.0"
description = "Self-improving agentic research swarm with local LLM inference"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    # Data / config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Inference
    "ollama>=0.4",
    "httpx>=0.27",
    # Memory / retrieval
    "chromadb>=0.5",
    "sqlite-vec>=0.1",
    "numpy>=1.26",
    # Templates
    "jinja2>=3.1",
    "markupsafe>=2.1",
    # Document parsing
    "markitdown[all]>=0.0.1",
    "pillow>=10.0",
    "pytesseract>=0.3",
    # Research skills
    "duckduckgo-search>=6.0",
    "playwright>=1.44",
    "youtube-transcript-api>=0.6",
    # Semantic Scholar
    "requests>=2.32",
]

[project.optional-dependencies]
finetune = [
    "torch>=2.3",
    "transformers>=4.40",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.19",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",       # FastAPI TestClient
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[project.scripts]
op       = "harness.cli:main"
harness  = "harness.api.main:serve"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length    = 100
select         = ["E", "F", "I", "UP", "B"]
ignore         = ["E501", "B008"]

[tool.ruff.per-file-ignores]
"harness/api/*" = ["B"]

[tool.mypy]
python_version        = "3.12"
strict                = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
